packages:
  - apps/*
  - packages/*

# Dependencies allowed to run install scripts (pnpm runs none by default).
allowBuilds:
  '@biomejs/biome': true
  argon2: true
  esbuild: true
  # Only @loomwork/cli's SQLite plugin needs it; DocMind runs on Postgres and `loom gen` opens no store.
  better-sqlite3: false

# pnpm's minimum release age holds back newly published versions. @loomwork is our own scope, published
# from loom, loom-ui and loom-plugins, so its releases are taken as soon as they are out.
minimumReleaseAgeExclude:
  - '@loomwork/*'
