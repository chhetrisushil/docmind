# Builds, typechecks, lints and tests DocMind, and builds and smoke-tests its container image. Loom and
# loom-ui come from the npm registry (@loomwork/*, @loomwork/ui-*) through pnpm-lock.yaml, like any other dependency.
name: ci

# Actions minutes are a budget: a PR runs CI once it is READY. Draft PRs skip every job (iterate
# against the full local gate), and main is checked after each merge.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: build + typecheck + lint + test
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Turns on the Postgres suites; without it they skip.
      DOCMIND_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          path: docmind
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docmind/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docmind/pnpm-lock.yaml
      - name: Install DocMind
        working-directory: docmind
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: docmind
        run: pnpm build
      - name: Typecheck
        working-directory: docmind
        run: pnpm typecheck
      - name: Typecheck test files
        working-directory: docmind
        run: pnpm typecheck:tests
      - name: Lint
        working-directory: docmind
        run: pnpm lint
      - name: Test
        working-directory: docmind
        run: pnpm test

  # The container image (Dockerfile): builds it, then runs infra/smoke-image.sh: migration job, read-only boot, /healthz, and a clean exit 0 on `docker stop`.
  # Independent of the gate, so the two run in parallel. Nothing is pushed anywhere.
  image:
    name: container image + smoke test
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: docmind
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        working-directory: docmind
        run: >-
          docker buildx build
          --cache-from type=gha,scope=docmind-image
          --cache-to type=gha,mode=max,scope=docmind-image
          --load -t docmind:ci .
      - name: Smoke test (migrate, boot read-only, /healthz, graceful stop)
        working-directory: docmind
        run: sh infra/smoke-image.sh docmind:ci
