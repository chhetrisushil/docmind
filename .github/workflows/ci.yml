# DocMind consumes the sibling ../loom checkout via pnpm.overrides (link:), because @loom/* is not
# published. CI therefore checks loom and loom-ui out NEXT TO this repo at pinned refs, builds them, then builds,
# typechecks, lints and tests DocMind against them.
#
# chhetrisushil/loom and chhetrisushil/loom-ui are private: the LOOM_TOKEN repository secret must hold a token with read access
# to both (a fine-grained PAT with "Contents: read" on those repositories). Without it the loom
# checkout fails, and so does the run: loudly, rather than testing against nothing.
name: ci

# Actions minutes are a budget: a PR runs CI once it is READY. Draft PRs skip every job (iterate
# against the full local gate), and main is checked after each merge.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The loom commit DocMind is built and tested against. Bump deliberately: rebuild ../loom at the
  # new commit, re-run the whole gate, then change this line.
  LOOM_REF: b0cb946130f9561d679138417fad877cf5347598
  # The loom-ui commit DocMind links to (core, hydration, renderer-lit, renderer-terminal, built from source).
  # Bump deliberately, like LOOM_REF.
  LOOM_UI_REF: 4ea5efd1ee177b68bae04c3ae53314d08c54b1f3

jobs:
  gate:
    name: build + typecheck + lint + test
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Turns on the Postgres suites; without it they skip.
      DOCMIND_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          path: docmind
      - name: Checkout loom (the framework DocMind links to)
        uses: actions/checkout@v4
        with:
          repository: chhetrisushil/loom
          ref: ${{ env.LOOM_REF }}
          token: ${{ secrets.LOOM_TOKEN }}
          path: loom
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docmind/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            loom/pnpm-lock.yaml
            loom-ui/pnpm-lock.yaml
            docmind/pnpm-lock.yaml
      - name: Install and build loom
        working-directory: loom
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Checkout loom-ui (the UI library DocMind links to)
        uses: actions/checkout@v4
        with:
          repository: chhetrisushil/loom-ui
          ref: ${{ env.LOOM_UI_REF }}
          token: ${{ secrets.LOOM_TOKEN }}
          path: loom-ui
      - name: Install and build loom-ui
        working-directory: loom-ui
        run: pnpm install --frozen-lockfile && pnpm --filter @loom-ui/core --filter @loom-ui/hydration --filter @loom-ui/renderer-lit --filter @loom-ui/renderer-terminal build
      - name: Install DocMind
        working-directory: docmind
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: docmind
        run: pnpm build
      - name: Typecheck
        working-directory: docmind
        run: pnpm typecheck
      - name: Typecheck test files
        working-directory: docmind
        run: pnpm typecheck:tests
      - name: Lint
        working-directory: docmind
        run: pnpm lint
      - name: Test
        working-directory: docmind
        run: pnpm test

  # The container image (Dockerfile): builds it from the same pinned loom and loom-ui checkouts as the gate, then
  # runs infra/smoke-image.sh: migration job, read-only boot, /healthz, and a clean exit 0 on `docker stop`.
  # Independent of the gate, so the two run in parallel. Nothing is pushed anywhere.
  image:
    name: container image + smoke test
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: docmind
          persist-credentials: false
      - name: Checkout loom (the framework DocMind links to)
        uses: actions/checkout@v4
        with:
          repository: chhetrisushil/loom
          ref: ${{ env.LOOM_REF }}
          token: ${{ secrets.LOOM_TOKEN }}
          path: loom
          persist-credentials: false
      - name: Checkout loom-ui (the UI library DocMind links to)
        uses: actions/checkout@v4
        with:
          repository: chhetrisushil/loom-ui
          ref: ${{ env.LOOM_UI_REF }}
          token: ${{ secrets.LOOM_TOKEN }}
          path: loom-ui
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        working-directory: docmind
        run: >-
          docker buildx build
          --build-context loom=../loom
          --build-context loom-ui=../loom-ui
          --cache-from type=gha,scope=docmind-image
          --cache-to type=gha,mode=max,scope=docmind-image
          --load -t docmind:ci .
      - name: Smoke test (migrate, boot read-only, /healthz, graceful stop)
        working-directory: docmind
        run: sh infra/smoke-image.sh docmind:ci
